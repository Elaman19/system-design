services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      # .env is host-oriented (see .env.example) for `npm run start:dev` and the
      # TypeORM CLI running directly on the host. Override just the vars that
      # need to differ inside the Compose network; env_file still supplies
      # everything else (credentials, PORT, ...).
      # - This container runs the built production artifact (Dockerfile strips
      #   devDependencies, incl. pino-pretty), so it must run as production.
      NODE_ENV: production
      DB_HOST: postgres
      REDIS_URL: redis://redis:6379
      OPENSEARCH_URL: http://opensearch:9200
      S3_ENDPOINT: http://seaweedfs:8333
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9200/_cluster/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  # minio/minio now requires a Docker Hub login to pull, so we use SeaweedFS's
  # S3 gateway instead. It runs without an -s3.config, so it accepts any
  # credentials; S3_ACCESS_KEY/S3_SECRET_KEY in .env are placeholders the app's
  # S3 client still needs to send, not values SeaweedFS actually checks.
  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - '8333:8333' # S3 API
      - '8888:8888' # filer UI/API (browse stored objects)
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8333/']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  opensearch-data:
  seaweedfs-data:
