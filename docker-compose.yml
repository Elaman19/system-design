services:
  app:
    build: .
    ports:
      - '3000:3000'
    env_file: .env
    environment:
      # This container runs the built production artifact (Dockerfile strips
      # devDependencies, incl. pino-pretty), so it must run as production
      # regardless of NODE_ENV in .env — overrides env_file, which still
      # supplies every other var.
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      opensearch:
        condition: service_started
      seaweedfs:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data

  # minio/minio now requires a Docker Hub login to pull, so we use SeaweedFS's
  # S3 gateway instead. It runs without an -s3.config, so it accepts any
  # credentials; S3_ACCESS_KEY/S3_SECRET_KEY in .env are placeholders the app's
  # S3 client still needs to send, not values SeaweedFS actually checks.
  seaweedfs:
    image: chrislusf/seaweedfs
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - '8333:8333' # S3 API
      - '8888:8888' # filer UI/API (browse stored objects)
    volumes:
      - seaweedfs-data:/data

volumes:
  pgdata:
  opensearch-data:
  seaweedfs-data:
