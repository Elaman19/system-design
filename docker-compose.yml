# Every Node process of the system runs from the same image; only the command
# differs. Variables that must point at sibling containers (the host-oriented
# .env says localhost) are overridden once here and merged into each service.
x-in-network-env: &in-network-env
  NODE_ENV: production
  DB_HOST: postgres
  REDIS_URL: redis://redis:6379
  OPENSEARCH_URL: http://opensearch:9200
  S3_ENDPOINT: http://seaweedfs:8333
  KAFKA_BROKERS: kafka:9092
  MAIL_SMTP_URL: smtp://mailpit:1025

x-node-process: &node-process
  build: .
  env_file: .env
  environment:
    <<: *in-network-env
  restart: unless-stopped
  stop_grace_period: 30s

services:
  app:
    build: .
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    env_file: .env
    environment:
      # .env is host-oriented (see .env.example) for `npm run start:dev` and the
      # TypeORM CLI running directly on the host. Override just the vars that
      # need to differ inside the Compose network; env_file still supplies
      # everything else (credentials, PORT, ...).
      # - This container runs the built production artifact (Dockerfile strips
      #   devDependencies, incl. pino-pretty), so it must run as production.
      <<: *in-network-env
      # Local stack only: lets scripts/load.mjs exercise graceful shutdown.
      WORK_ENDPOINT_ENABLED: 'true'
      # Local stack only: lets scripts/clickstream-load.mjs pick the visitor IP with
      # X-Forwarded-For. Behind a real balancer, trust only its address.
      TRUST_PROXY: 'true'
    # /ready (not /live): the container is "healthy" only while it can serve
    # traffic. Compose never restarts an unhealthy container by itself, so a
    # dependency outage flips health without a restart.
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:$${PORT}/ready || exit 1']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s
    # Must exceed SHUTDOWN_DRAIN_MS + SHUTDOWN_TIMEOUT_MS, else SIGKILL cuts
    # off the graceful shutdown.
    stop_grace_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    # No depends_on on redis, kafka or mailpit: the API must keep working
    # without them. Purchases leave a row in the outbox for the relay to pick up,
    # views are buffered and dropped when Kafka is away (see docs/background).

  # Schema changes are a separate step, not something the app does on startup:
  # a one-shot job from the same image, applied before `app` starts. Re-running
  # it is safe (already-applied migrations are skipped). CI does the same
  # against an empty app_test database, see `npm run db:test:migrate`.
  migrate:
    build: .
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: postgres
    command:
      [
        'node',
        'node_modules/typeorm/cli.js',
        'migration:run',
        '-d',
        'dist/data-source.js',
      ]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy

  # --- Background processes -------------------------------------------------
  # Same image, own container each: they scale and fail independently of the API.

  # Moves rows of the outbox table into the BullMQ queue (FOR UPDATE SKIP LOCKED,
  # so several copies would not take the same row).
  outbox-relay:
    <<: *node-process
    command: ['node', 'dist/entrypoints/outbox-relay.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # BullMQ consumer: sends receipts, ban alerts and the daily report.
  worker:
    <<: *node-process
    command: ['node', 'dist/entrypoints/worker.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Group clickstream-archiver: lot-views -> files in S3.
  clickstream-archiver:
    <<: *node-process
    command: ['node', 'dist/entrypoints/clickstream-archiver.js']
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      seaweedfs:
        condition: service_healthy

  # Group abuse-detector: lot-views -> ip-bans.
  abuse-detector:
    <<: *node-process
    command: ['node', 'dist/entrypoints/abuse-detector.js']
    depends_on:
      kafka-init:
        condition: service_completed_successfully

  # Group ip-ban-recorder: ip-bans -> Postgres + BullMQ job "mail the admin".
  ban-recorder:
    <<: *node-process
    command: ['node', 'dist/entrypoints/ban-recorder.js']
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Fires the daily report. EXACTLY ONE copy, never scale it: every copy has its own
  # timer, so N copies mean N reports a day. API and workers scale, the scheduler does not.
  scheduler:
    <<: *node-process
    command: ['node', 'dist/entrypoints/scheduler.js']
    depends_on:
      redis:
        condition: service_healthy

  # Creates the Kafka topics (3 partitions, retention) before anyone reads them,
  # like `migrate` does for Postgres. Re-running is safe.
  kafka-init:
    <<: *node-process
    restart: 'no'
    command: ['node', 'dist/entrypoints/kafka-topics.js']
    depends_on:
      kafka:
        condition: service_healthy

  # Images are pinned to an exact version: a floating tag (`latest`, `17-alpine`) pulls
  # whatever was released last, so two machines or two CI runs can start different
  # servers from the same file. Bump the version on purpose, in a commit.
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4.11-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.19.6
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      DISABLE_INSTALL_DEMO_CONFIG: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'curl -sf http://localhost:9200/_cluster/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  # minio/minio now requires a Docker Hub login to pull, so we use SeaweedFS's
  # S3 gateway instead. It runs without an -s3.config, so it accepts any
  # credentials; S3_ACCESS_KEY/S3_SECRET_KEY in .env are placeholders the app's
  # S3 client still needs to send, not values SeaweedFS actually checks.
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    # Every bucket is a "collection" with volumes of its own (7 at a time), and a single
    # server defaults to a handful of volumes sized for a big disk: after a few buckets
    # PUT fails with "No writable volumes". Small volumes and a high cap keep a local
    # stack (and one test bucket per test) working.
    command: server -dir=/data -s3 -s3.port=8333 -master.volumeSizeLimitMB=64 -volume.max=500
    ports:
      - '8333:8333' # S3 API
      - '8888:8888' # filer UI/API (browse stored objects)
    volumes:
      - seaweedfs-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:8333/']
      interval: 5s
      timeout: 5s
      retries: 10

  # Single-node KRaft broker (no ZooKeeper). Two listeners: kafka:9092 for
  # containers, localhost:9094 for the host (tests, kafka-*.sh from outside).
  # Topics are not auto-created: a typo in a topic name must fail, not
  # silently create a one-partition topic.
  kafka:
    image: apache/kafka:4.2.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      # One broker: the internal topics cannot have more replicas.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Do not wait for more members before the first rebalance of a group.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    ports:
      - '9094:9094'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1',
        ]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  # Catches every outgoing mail: nothing leaves the machine. SMTP 1025, web UI 8025.
  mailpit:
    image: axllent/mailpit:v1.31.6
    ports:
      - '1025:1025'
      - '8025:8025'
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  opensearch-data:
  seaweedfs-data:
  kafka-data:
